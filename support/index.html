<style>
  :root { --cream:#F7F1EA; --card:#FFFDFA; --ink:#121212; --muted:#6B6460; --line:#E4DACF; --pink:#FA3AA1; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:'Inter',system-ui,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
  header { padding:24px; }
  header a { display:inline-flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-weight:700; font-size:20px; letter-spacing:-0.02em; }
  header svg { width:26px; height:26px; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px 20px 64px; }
  .stamp { width:124px; height:150px; margin-bottom:32px; transform:rotate(-6deg); animation:pop .5s cubic-bezier(.2,1.5,.4,1) both; }
  .stamp text { font-family:'Inter',system-ui,sans-serif; font-size:14px; font-weight:700; letter-spacing:-0.01em; fill:#FA3AA1; }
  @keyframes pop { 0% { opacity:0; transform:rotate(-6deg) translateY(12px) scale(.94); } 100% { opacity:1; transform:rotate(-6deg); } }
  @media (prefers-reduced-motion: reduce) { .stamp { animation:none; } }
  h1 { font-size:clamp(36px, 8vw, 52px); font-weight:800; letter-spacing:-0.03em; line-height:1.05; margin:0 0 14px; }
  .lead { font-size:17px; line-height:1.55; color:var(--muted); margin:0 auto 32px; max-width:400px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; height:54px; padding:0 34px; border-radius:999px;
         background:var(--ink); color:#fff; font-size:17px; font-weight:600; text-decoration:none; transition:transform .15s ease; }
  .btn:hover { transform:translateY(-1px); }
  .addr { display:block; margin-top:16px; font-size:14px; color:var(--muted); }

  footer { padding:24px; text-align:center; font-size:13px; color:var(--muted); }
  footer a { color:inherit; margin:0 8px; }
</style>
